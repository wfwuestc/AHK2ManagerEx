name: Build

on:
  label: 
    types:
      - created
      - edited
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 新建仓库默认给 GITHUB_TOKEN 只读权限，Release 步骤会 403；
# 这一步是 softprops/action-gh-release 创建 Release 的必需权限。
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Build with AHK v2
        uses: nukdokplex/autohotkey-build@v0.1
        with:
          version: v2.0.2
          x64: true
          x86: true
          compression: upx
          in: ""
          out: build
      - name: Do domething with builded scripts
        shell: pwsh
        run: |
          ls build
      - name: Release
        uses: softprops/action-gh-release@v0.1.15
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build/AHK2ManagerEx_x64.exe
            build/AHK2ManagerEx_x86.exe
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
